
name: Daily remote job scan

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run job scanner
        env:
          JOB_HUNTER_DATA_DIR: ${{ github.workspace }}/job_hunter_data
        run: |
          python job_hunter.py scan --min-score 5

      - name: Save job results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job_hunter_data/jobs.json job_hunter_data/daily_report.md
          if ! git diff --cached --quiet; then
            git commit -m "Update daily remote job matches"
            git push
          else
            echo "No job queue changes to commit."
          fi
